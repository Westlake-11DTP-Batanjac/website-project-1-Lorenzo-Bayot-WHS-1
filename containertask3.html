<!DOCTYPE html> 

<html lang="en"> 

<head> 

    <meta charset="UTF-8"> 

    <title>Task 3 - Semantic Layout Challenge</title> 

    <link rel="stylesheet" href="containertask3.css"> 

</head> 

<body> 

  

    <div class="page-container"> 

  

        <header> 

            <!-- TASK: Add Logo div and Heading 1 here --> 
            <div class="logo"><h1>logo image</h1></div>
            <h1 class="title">Heading 1</h1>
        </header> 

  

        <nav> 

            <!-- TASK: Create a list for: Home, About Us, Contact Us --> 
            <ul>
                <li>Home</li>
                <li>About Us</li>
                <li>Contact Us</li>
            </ul>
        </nav> 

  

        <main class="main-content"> 

            <!-- TASK: Add the two content boxes (text and image) -->
            <div class="content-box">
                <h2>Heading 2</h2>
                <br/>
                <p>content</p>
            </div> 
            <div class="image-box">
                <p>image</p>
            </div>

        </main> 

  

        <footer> 

            <!-- TASK: Add footer info and the social links div --> 
            <div class="footerinfo">
                <ul>
                    <li>footer info</li>
                </ul>
            <div class="social-links"><p>social media links</p></div>
        </footer> 

  

    </div> 

  

</body> 

</html>
